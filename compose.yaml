services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: archimesh
      POSTGRES_USER: archimesh
      POSTGRES_PASSWORD: local-dev-only
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U archimesh -d archimesh']
      interval: 5s
      timeout: 5s
      retries: 10

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0
    ports:
      - '127.0.0.1:10000:10000'
    volumes:
      - azurite_data:/data

volumes:
  postgres_data:
  azurite_data:
